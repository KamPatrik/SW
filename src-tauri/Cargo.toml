[package]
name = "revela"
version = "0.5.0"
description = "Revela — open-source photo catalog & darkroom with film negative conversion"
edition = "2021"
license = "GPL-3.0-or-later"
repository = ""

[lib]
name = "revela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
rawler = "0.8"
walkdir = "2"
base64 = "0.22"
chrono = "0.4"
kamadak-exif = "0.6"

# Image processing is unusable without optimizations, even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
